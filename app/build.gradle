apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

ktlint {
    version = "1.8.0"
    android = true
    verbose = true
    outputColorName = "RED"
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

def convexUrl = localProps.getProperty('convexUrl') ?: System.getenv('CONVEX_URL') ?: System.getenv('VITE_CONVEX_URL') ?: ""
def escapedConvexUrl = convexUrl.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    if (localProps['storeFile']) {
        signingConfigs {
            release {
                storeFile file(localProps['storeFile'])
                storePassword localProps['storePassword']
                keyAlias localProps['keyAlias']
                keyPassword localProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.vandam.luma"
        minSdk 31
        targetSdk 35
        versionCode 56
        versionName "2.0.12"
        buildConfigField "String", "CONVEX_URL", "\"${escapedConvexUrl}\""
    }

    buildFeatures {
        compose = true
        viewBinding = true
        buildConfig = true
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (localProps['storeFile']) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError = false
    }
    namespace = 'com.vandam.luma'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // Android lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.8.5"
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.5'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // JETPACK Compose with BOM for version management
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.ui:ui'

    implementation "androidx.constraintlayout:constraintlayout-compose:1.1.0"

    // Biometric
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation("dev.convex:android-convexmobile:0.8.0@aar") {
        transitive = true
    }
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
}
